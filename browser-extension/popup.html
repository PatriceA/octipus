<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fafafa;
    }
    .header {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 { font-size: 15px; font-weight: 600; }
    .header .subtitle { font-size: 11px; opacity: 0.7; margin-top: 2px; }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.connected { background: #4CAF50; box-shadow: 0 0 6px #4CAF50; }
    .status-dot.disconnected { background: #9E9E9E; }
    .status-dot.error { background: #f44336; }
    .content { padding: 16px; }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .field input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: #4a90d9; }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #1a1a2e; color: white; }
    .btn-danger { background: #f44336; color: white; }
    .btn-secondary { background: #e0e0e0; color: #333; }
    .status-text {
      text-align: center;
      padding: 8px;
      font-size: 12px;
      color: #666;
      border-top: 1px solid #eee;
    }
    .status-text.connected { color: #4CAF50; }
    .status-text.error { color: #f44336; }
  </style>
</head>
<body>
  <div class="header">
    <div class="status-dot disconnected" id="statusDot"></div>
    <div>
      <h1>Octipus Browser Bridge</h1>
      <div class="subtitle">AI agent browser access</div>
    </div>
  </div>

  <div class="content">
    <div class="field">
      <label>Backend URL</label>
      <input type="text" id="backendUrl" placeholder="ws://localhost:3005/ws/browser-bridge">
    </div>
    <div class="field">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="octi_… (generate in Settings → API Tokens)">
    </div>
    <div class="actions">
      <button class="btn-primary" id="connectBtn">Connect</button>
      <button class="btn-danger" id="disconnectBtn" style="display:none">Disconnect</button>
      <button class="btn-secondary" id="saveBtn">Save</button>
    </div>
  </div>

  <div class="status-text" id="statusText">Not connected</div>

  <script src="popup.js"></script>
</body>
</html>
