services:
  assistant:
    build: .
    container_name: assistant-app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${ASSISTANT_API_PORT:-3015}:3005"
      - "${ASSISTANT_WEB_PORT:-3017}:3007"
    environment:
      # Database — hardcoded to Docker service names (overrides .env.docker)
      - DATABASE_URL=postgresql://assistant:${POSTGRES_PASSWORD:-assistant}@assistant-db:5432/assistant
      # Redis
      - REDIS_URL=redis://assistant-redis:6379
      # Security
      - MASTER_KEY=${MASTER_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      # Model providers (optional)
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      # Channels (optional)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # Workspace
      - WORKSPACE_ROOT=/data/workspace
      - DOCUMENTS_PATH=/data/documents
    volumes:
      - assistant-workspace:/data/workspace
      - assistant-documents:/data/documents
      - assistant-extensions:/data/extensions
    depends_on:
      assistant-db:
        condition: service_healthy
      assistant-redis:
        condition: service_healthy

  assistant-db:
    image: pgvector/pgvector:pg16
    container_name: assistant-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=assistant
      - POSTGRES_USER=assistant
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-assistant}
    volumes:
      - assistant-pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 5s
      timeout: 3s
      retries: 5

  assistant-redis:
    image: redis:7-alpine
    container_name: assistant-redis
    restart: unless-stopped
    volumes:
      - assistant-redis:/data
    ports:
      - "${REDIS_PORT:-6389}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  assistant-pgdata:
  assistant-redis:
  assistant-workspace:
  assistant-documents:
  assistant-extensions:
