services:
  octipus:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_PORT: ${OCTIPUS_API_PORT:-3015}
    container_name: octipus-app
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${OCTIPUS_API_PORT:-3015}:3005"
      - "${OCTIPUS_WEB_PORT:-3017}:3007"
    environment:
      # Database — hardcoded to Docker service names (overrides .env.docker)
      - DATABASE_URL=postgresql://octipus:${POSTGRES_PASSWORD:-octipus}@octipus-db:5432/octipus
      # Security
      - MASTER_KEY=${MASTER_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      # Model providers (optional)
      - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-}
      - OLLAMA_URL=${OLLAMA_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - ZAI_API_KEY=${ZAI_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - VOYAGE_API_KEY=${VOYAGE_API_KEY:-}
      # Channels (optional)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # Workspace
      - WORKSPACE_ROOT=/data/workspace
      - DOCUMENTS_PATH=/data/documents
    volumes:
      - octipus-workspace:/data/workspace
      - octipus-documents:/data/documents
      - octipus-extensions:/data/extensions
      # Docker socket (OPT-IN — disabled by default): lets Octipus spawn
      # sibling containers for tools not installed in the main image.
      #
      # ⚠️  SECURITY: mounting the host Docker socket grants the container
      # (and therefore any agent shell command that reaches it) root-equivalent
      # control of the HOST. Only enable this on a trusted, single-tenant host,
      # and keep the agent shell sandbox enabled. Uncomment to enable:
      #   On Linux/macOS:           /var/run/docker.sock:/var/run/docker.sock
      #   On Windows (Docker Desktop): //var/run/docker.sock:/var/run/docker.sock
      # - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      octipus-db:
        condition: service_healthy

  octipus-db:
    image: pgvector/pgvector:pg16
    container_name: octipus-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=octipus
      - POSTGRES_USER=octipus
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-octipus}
    volumes:
      - octipus-pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5442}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U octipus"]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  octipus-pgdata:
  octipus-workspace:
  octipus-documents:
  octipus-extensions:
