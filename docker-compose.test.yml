services:
  octipus-test-db:
    image: pgvector/pgvector:pg16
    container_name: octipus-test-db
    environment:
      # Use the default `postgres` superuser for bootstrap so the init
      # script can create a non-superuser `octipus` app role (needed so
      # RLS actually fires under tests).
      - POSTGRES_DB=octipus_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=test
    # tmpfs-backed: no volume mount => data wiped when container stops
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      # Demote `octipus` from SUPERUSER so RLS policies are enforced — see
      # the comment in postgres-init.sql.
      - ./tests/integration/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${TEST_POSTGRES_PORT:-5443}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d octipus_test"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s

  octipus-test-redis:
    image: redis:7-alpine
    container_name: octipus-test-redis
    # No volume mount — ephemeral by default
    command: redis-server --save "" --appendonly no
    ports:
      - "${TEST_REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
