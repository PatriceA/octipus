name: Interactive answers (inline UI)
description: >
  Whether the root agent writes an interactive answer (an `octi-ui` block,
  stored and replaced by a `[[octi-ui:<id>|<title>]]` marker) when a control,
  a calculation, a visual or a step-through helps more than text — and only
  then (docs/plans/inline-ui-spec.md §5.10). Every case declares
  `renders: [inline_ui]`, as the web chat does, except the one that checks
  that a client which does not declare it is never offered the format.
  Integration mode only (`npm run eval -- --suite inline-ui --integration`):
  unit mode never builds the root prompt, so the runner refuses these cases
  there.

  Gate (spec §5.10): positives ≥ 70% use, negatives ≤ 10% use. Run each case
  3× on at least two models; the ambiguous cases are reported, not gated.

tests:
  # ── Positives: a control, a calculation, a visual or a step-through helps ──
  - id: iu-pos-loan-calculator
    description: Loan payment calculator
    input: "Give me a loan payment calculator: amount, yearly interest rate and years, showing the monthly payment and total interest."
    context:
      renders: [inline_ui]
    assertions:
      - type: matches_regex
        value: "\\[\\[octi-ui:[0-9a-f-]{36}\\|"
        description: An interactive answer was stored and shown
      - type: not_contains
        value: "could not be shown"
        description: No block was refused
      - type: not_contains
        value: "```octi-ui"
        description: No raw fence reached the user
    tags: [inline-ui, positive]

