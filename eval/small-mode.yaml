name: Small-Mode Orchestrator Tests
description: >
  Verify router-mode routing. Router maps the classifier's topic → role
  deterministically (no orchestrator LLM) and relays a single specialist's
  output; the topic→role mapping is identical to full mode. Router routing is
  only as precise as the classifier's topic vocabulary, so we assert
  routes_to_role only for inputs the classifier resolves cleanly, and assert
  classification alone for fuzzier cases (mirroring routing.yaml). Run with
  ORCHESTRATOR_MODE=router (or a ≤10B default model under mode=auto).

tests:
  - id: router-coding-task
    description: Clear code request routes to a single coding specialist
    input: "Implement a REST API endpoint for user registration with email validation"
    assertions:
      - type: classification
        value: task
      - type: routes_to_role
        value: coding
    tags: [small-mode, router, coding]

  - id: router-research-task
    description: Research request routes to the research specialist
    input: "Research current best practices for rate-limiting a public API"
    assertions:
      - type: classification
        value: task
      - type: routes_to_role
        value: research
    tags: [small-mode, router, research]

  - id: router-greeting-no-spawn
    description: Greetings short-circuit to a direct reply (no specialist spawn)
    input: "hey there"
    assertions:
      - type: classification
        value: casual
    tags: [small-mode, router, casual]

  - id: router-ambiguous-clarify
    description: Vague request is classified ambiguous → router clarifies, no spawn
    input: "I would really appreciate it if you could help me out here somehow"
    assertions:
      - type: classification
        value: ambiguous
    tags: [small-mode, router, clarify]
