version: 2
updates:
  # Root app (bun/npm lockfile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One PR for the routine patch/minor bumps to keep the noise down; majors
      # still come as individual PRs so they can be reviewed on their own.
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  # Next.js web app.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, web]

  # Published MCP server package.
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, mcp-server]

  # Tauri desktop shell (Rust).
  - package-ecosystem: cargo
    directory: /web/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, desktop]

  # The GitHub Actions themselves — keeps the pinned action versions current
  # (and complements the Zizmor workflow audit).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
