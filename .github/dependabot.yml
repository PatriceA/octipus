version: 2
updates:
  # Root app (bun/npm lockfile).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One PR for the routine patch/minor bumps to keep the noise down; majors
      # still come as individual PRs so they can be reviewed on their own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Deferred for a deliberate upgrade — Bolt 4→5 has breaking API changes.
      - dependency-name: "@slack/bolt"
        update-types: ["version-update:semver-major"]

  # Next.js web app.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ESLint 9→10 needs a flat-config migration; do it deliberately.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript majors land breaking type-checker changes; upgrade on purpose.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Published MCP server package.
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Zod 3→4 has breaking changes; coordinate with the root package upgrade.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  # Tauri desktop shell (Rust).
  - package-ecosystem: cargo
    directory: /web/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # The GitHub Actions themselves — keeps the pinned action versions current
  # (and complements the Zizmor workflow audit).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
