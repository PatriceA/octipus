version: 2
updates:
  # Root app. NOTE: Dependabot cannot write `bun.lock`, so every PR it opens
  # here bumps `package.json` alone and then fails at
  # `bun install --frozen-lockfile` in the first job. Treat these PRs as
  # NOTIFICATIONS: apply the bump locally (`bun install` moves both files),
  # verify, push to main, and close the PR referencing the commit.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      # One PR for the routine patch/minor bumps to keep the noise down; majors
      # still come as individual PRs so they can be reviewed on their own.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Deferred for a deliberate upgrade — Bolt 4→5 has breaking API changes.
      - dependency-name: "@slack/bolt"
        update-types: ["version-update:semver-major"]

  # Next.js web app.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # ESLint 10 is blocked UPSTREAM, not by our config: `eslint-plugin-react`
      # (pulled in by eslint-config-next) is at 7.37.5, declares
      # `peerDependencies.eslint: ^3 … ^9.7`, and calls the `context.getFilename()`
      # API that ESLint 10 removed — every file errors with
      # "contextOrFilename.getFilename is not a function" (measured 2026-08-21).
      # Revisit when the plugin ships ESLint 10 support. This ignore did NOT
      # stop Dependabot opening #315 anyway, so expect to close it by hand.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript majors land breaking type-checker changes; upgrade on purpose.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # Published MCP server package.
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Zod 3→4 has breaking changes; coordinate with the root package upgrade.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]

  # Tauri desktop shell (Rust).
  - package-ecosystem: cargo
    directory: /web/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  # The GitHub Actions themselves — keeps the pinned action versions current
  # (and complements the Zizmor workflow audit).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Bundle routine action patch/minor bumps into one PR; majors still come
      # individually so version jumps get their own review.
      minor-and-patch:
        update-types: [minor, patch]
