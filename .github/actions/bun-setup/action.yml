name: Bun setup
description: Install the pinned Bun and restore the shared ~/.bun/install/cache.

# One place for the Bun version pin (previously copy-pasted into every job) and
# the dependency cache. setup-bun@v2 has no built-in cache, so `bun install`
# re-downloaded the whole tree on every job; caching bun's global install cache
# keeps `--frozen-lockfile` correct (it only accelerates downloads) while
# cutting the network fetch. Keyed on the lockfiles so a dep change busts it.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11

    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
