name: Dependency Review

on:
  pull_request:

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # dependency-review-action only operates on pull requests.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Non-blocking until the repo's Dependency Graph feature is enabled — the
      # action hard-fails ("Dependency review is not supported on this
      # repository") without it. Enable it at
      # Settings → Security → Dependency graph, then remove `continue-on-error`
      # to make this a blocking gate.
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
