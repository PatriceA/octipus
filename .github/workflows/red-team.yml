name: Red-team eval

# Weekly (and on-demand) validation of the adversarial red-team suite
# (prompt-injection, data-leakage, tool-misuse, role-confusion, off-topic-drift).
#
# This runs in `--dry-run` mode: it generates every test case and exercises the
# harness WITHOUT calling an LLM, so it needs no provider keys, database, or
# model/topic configuration and stays free to run. It guards the red-team
# generators against bit-rot.
#
# A full scored run (actually sending the adversarial prompts through the
# orchestrator) additionally needs provider API keys + a configured model/topic
# registry; wire that as a follow-up once those secrets exist, e.g. by dropping
# `--dry-run` behind an `if: secrets.<PROVIDER>_API_KEY != ''` guard.

on:
  # Run on PRs that touch the red-team code so a broken generator fails on the
  # PR, not days later on the Monday cron (which lands on `main`).
  pull_request:
    paths:
      - 'src/eval/red-team/**'
      - '.github/workflows/red-team.yml'
  schedule:
    # Mondays 07:30 UTC — off-peak, staggered off the top of the hour.
    - cron: '30 7 * * 1'
  workflow_dispatch:

concurrency:
  group: red-team-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  red-team:
    name: Red-team suite (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Dummy 32+ char secrets so config-load validation passes; dry-run makes
      # no real provider calls.
      MASTER_KEY: ci-dummy-master-key-for-red-team-dryrun-1234567890
      JWT_SECRET: ci-dummy-jwt-secret-for-red-team-dryrun-1234567890
      SESSION_SECRET: ci-dummy-session-secret-for-red-team-dryrun-1234567890
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun (+ dependency cache)
        uses: ./.github/actions/node-setup

      - name: Install dependencies
        run: npm ci

      - name: Generate red-team suite (dry-run)
        run: npm run src/eval/red-team/cli.ts --dry-run
