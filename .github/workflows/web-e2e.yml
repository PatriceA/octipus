name: Web E2E

# Playwright end-to-end tests for the web UI (tests/web). The specs drive a
# production build of the Next.js app with every `/api/**` call stubbed at the
# browser, so no backend, database, or provider keys are needed — just the
# front-end. See playwright.config.ts.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Web E2E (playwright · chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install web deps
        run: bun install --frozen-lockfile
        working-directory: web

      # Installs the Chromium build matching the pinned @playwright/test, plus
      # its OS libraries.
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      # Production build up front; playwright.config.ts starts `next start`
      # (instant) rather than a lazy dev server when CI is set.
      - name: Build web (production)
        run: bun run build
        working-directory: web

      - name: Run Playwright tests
        run: bunx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
