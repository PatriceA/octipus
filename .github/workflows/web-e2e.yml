name: Web E2E

# Playwright end-to-end tests for the web UI (tests/web). The specs drive a
# production build of the Next.js app with every `/api/**` call stubbed at the
# browser, so no backend, database, or provider keys are needed — just the
# front-end. See playwright.config.ts.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Web E2E (playwright · chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun (+ dependency cache)
        uses: ./.github/actions/node-setup

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19'

      - name: Install root deps
        run: npm ci

      - name: Install web deps
        run: npm ci
        working-directory: web

      # Installs the Chromium build matching the pinned @playwright/test, plus
      # its OS libraries.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Built up front so playwright.config.ts can start the static server
      # instantly rather than waiting on a lazy dev server.
      - name: Build web (production)
        run: npm run build
        working-directory: web

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
