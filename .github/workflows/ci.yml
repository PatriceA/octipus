name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: every job here only reads the checkout. Set at the top level
# so all jobs inherit it (and none silently get the token's broad default).
permissions:
  contents: read

jobs:
  backend:
    name: Backend (typecheck · lint · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun (+ dependency cache)
        uses: ./.github/actions/node-setup

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # The architecture catalog is generated from the source. Gating it is the
      # point: a route, a module edge or an event type that changed without the
      # committed catalog changing means the docs have started drifting again.
      - name: Catalog is current
        run: npm run catalog:check

      - name: Test
        run: npm run test -- --coverage
        env:
          # Dummy 32+ char secrets to satisfy config-load validation in tests.
          # Code paths that construct LiteLLMClient eagerly call loadConfig().
          MASTER_KEY: ci-dummy-master-key-for-unit-tests-only-1234567890
          JWT_SECRET: ci-dummy-jwt-secret-for-unit-tests-only-1234567890
          SESSION_SECRET: ci-dummy-session-secret-for-unit-tests-only-1234567890

      # Surface coverage in the job summary and fail if it drops below the
      # committed baseline (scripts/coverage-baseline.json). `npm run test`
      # above writes coverage/lcov.info (vitest.config.ts). Self-contained — no
      # Codecov/token/upload.
      - name: Coverage summary + ratchet
        run: npx tsx scripts/coverage-check.ts

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 7

      # Blocking dependency audit. Accepted advisories are recorded in a
      # reviewable allowlist (scripts/audit-allowlist.json); see the wrapper
      # scripts/audit-check.ts and scripts/audit-allowlist.README.md.
      - name: Audit dependencies
        run: npx tsx scripts/audit-check.ts

  web:
    name: Web (typecheck · lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun (+ dependency cache)
        uses: ./.github/actions/node-setup

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19'

      - name: Install root deps
        run: npm ci

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Typecheck web
        run: npx tsc --noEmit
        working-directory: web

      - name: Lint web
        run: npm run lint
        working-directory: web

  desktop:
    name: Desktop (static export · tauri compile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun (+ dependency cache)
        uses: ./.github/actions/node-setup

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.19'

      - name: Install root deps
        run: npm ci

      - name: Install web deps
        run: npm ci
        working-directory: web

      # Catches the static-export blocker: `output: 'export'` fails the build
      # if any dynamic route lacks generateStaticParams (see web/app/**/[id]).
      - name: Build static export (Tauri mode)
        run: TAURI_BUILD=true npm run build
        working-directory: web

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          # --no-install-recommends: the plain install pulls ~188 packages
          # (gstreamer, pipewire, docs) and spent 16 min in the Azure mirror
          # on 2026-08-19. Only the link-time deps are needed to compile.
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri

      - name: Cargo check (Tauri app)
        run: cargo check --manifest-path web/src-tauri/Cargo.toml

  mcp-server:
    name: MCP server (typecheck · build · publish-check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun (+ dependency cache)
        uses: ./.github/actions/node-setup

      - name: Install deps
        run: npm ci
        working-directory: mcp-server

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: mcp-server

      - name: Build
        run: npm run build
        working-directory: mcp-server

      - name: Verify dist/index.js exists
        # Catches the misalignment between package.json (main: dist/index.js,
        # files: ['dist']) and a misconfigured tsc that would silently emit
        # to a different folder. An `npm publish` with no dist/index.js would
        # ship a broken package.
        run: test -f dist/index.js
        working-directory: mcp-server

      - name: npm pack dry-run (verify shipped files)
        run: |
          set -e
          out=$(npm pack --dry-run --json)
          echo "$out"
          echo "$out" | grep -q 'dist/index.js' || (echo "::error::dist/index.js missing from npm pack" && exit 1)
        working-directory: mcp-server
