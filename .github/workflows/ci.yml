name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck · lint · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test
        env:
          # Dummy 32+ char secrets to satisfy config-load validation in tests.
          # Code paths that construct LiteLLMClient eagerly call loadConfig().
          MASTER_KEY: ci-dummy-master-key-for-unit-tests-only-1234567890
          JWT_SECRET: ci-dummy-jwt-secret-for-unit-tests-only-1234567890
          SESSION_SECRET: ci-dummy-session-secret-for-unit-tests-only-1234567890

      - name: Audit dependencies
        run: bun audit --prod
        continue-on-error: true

  web:
    name: Web (typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install web deps
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Typecheck web
        run: bunx tsc --noEmit
        working-directory: web

  mcp-server:
    name: MCP server (typecheck · build · publish-check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: bun install --frozen-lockfile
        working-directory: mcp-server

      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: mcp-server
        continue-on-error: true

      - name: Build
        run: bun run build
        working-directory: mcp-server

      - name: Verify dist/index.js exists
        # Catches the misalignment between package.json (main: dist/index.js,
        # files: ['dist']) and a misconfigured tsc that would silently emit
        # to a different folder. An `npm publish` with no dist/index.js would
        # ship a broken package.
        run: test -f dist/index.js
        working-directory: mcp-server

      - name: npm pack dry-run (verify shipped files)
        run: |
          set -e
          out=$(npm pack --dry-run --json)
          echo "$out"
          echo "$out" | grep -q 'dist/index.js' || (echo "::error::dist/index.js missing from npm pack" && exit 1)
        working-directory: mcp-server
