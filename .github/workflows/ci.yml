name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck · lint · test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: |
          set +e
          bun test src scripts --timeout 30000 --reporter=junit --reporter-outfile=junit.xml
          code=$?
          echo "=== FAILING TESTCASES (file = classname) ==="
          grep -B1 -A4 '<failure' junit.xml | head -60 || true
          echo "=== classnames with failures ==="
          grep -E 'testcase|<failure' junit.xml | grep -iB1 'failure' | grep 'classname' | head || true
          exit $code
        env:
          # Dummy 32+ char secrets to satisfy config-load validation in tests.
          # Code paths that construct LiteLLMClient eagerly call loadConfig().
          MASTER_KEY: ci-dummy-master-key-for-unit-tests-only-1234567890
          JWT_SECRET: ci-dummy-jwt-secret-for-unit-tests-only-1234567890
          SESSION_SECRET: ci-dummy-session-secret-for-unit-tests-only-1234567890

      # Blocking dependency audit. Accepted advisories are recorded in a
      # reviewable allowlist (scripts/audit-allowlist.json); see the wrapper
      # scripts/audit-check.ts and scripts/audit-allowlist.README.md.
      - name: Audit dependencies
        run: bun run scripts/audit-check.ts

  web:
    name: Web (typecheck · lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install web deps
        run: bun install --frozen-lockfile
        working-directory: web

      - name: Typecheck web
        run: bunx tsc --noEmit
        working-directory: web

      - name: Lint web
        run: bun run lint
        working-directory: web

  desktop:
    name: Desktop (static export · tauri compile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install web deps
        run: bun install --frozen-lockfile
        working-directory: web

      # Catches the static-export blocker: `output: 'export'` fails the build
      # if any dynamic route lacks generateStaticParams (see web/app/**/[id]).
      - name: Build static export (Tauri mode)
        run: TAURI_BUILD=true bun run build
        working-directory: web

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/src-tauri

      - name: Cargo check (Tauri app)
        run: cargo check --manifest-path web/src-tauri/Cargo.toml

  mcp-server:
    name: MCP server (typecheck · build · publish-check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install deps
        run: bun install --frozen-lockfile
        working-directory: mcp-server

      - name: Typecheck
        run: bunx tsc --noEmit
        working-directory: mcp-server

      - name: Build
        run: bun run build
        working-directory: mcp-server

      - name: Verify dist/index.js exists
        # Catches the misalignment between package.json (main: dist/index.js,
        # files: ['dist']) and a misconfigured tsc that would silently emit
        # to a different folder. An `npm publish` with no dist/index.js would
        # ship a broken package.
        run: test -f dist/index.js
        working-directory: mcp-server

      - name: npm pack dry-run (verify shipped files)
        run: |
          set -e
          out=$(npm pack --dry-run --json)
          echo "$out"
          echo "$out" | grep -q 'dist/index.js' || (echo "::error::dist/index.js missing from npm pack" && exit 1)
        working-directory: mcp-server
