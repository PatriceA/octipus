name: Zizmor

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: Zizmor (workflow audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # Pinned version, not `latest`, so a zizmor release cannot change CI
      # behaviour for unrelated PRs.
      - name: Install zizmor
        run: pip install zizmor==1.5.2

      # Blocking on zizmor's local audits (template-injection, excessive
      # permissions, credential persistence, dangerous triggers, …) — the
      # high-value checks, now all clean on our workflows.
      #
      # `--offline` skips the audits that require GitHub API access
      # (ref-confusion, known-vulnerable-actions, impostor-commit). Those want
      # every third-party action SHA-pinned; pinning + re-enabling the online
      # audits is a follow-up. Offline keeps this gate deterministic and
      # reproducible locally (`zizmor --offline .github/workflows/`).
      - name: Audit workflows
        run: zizmor --offline .github/workflows/
