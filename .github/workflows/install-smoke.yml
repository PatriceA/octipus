name: Install smoke

# The single highest-value test we can run: it exercises exactly what every new
# self-hoster does first — `octi setup` → `octi doctor` → boot the backend — with
# zero external services (embedded PGlite). See scripts/smoke-test.sh.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the primary target; macOS is a cross-OS smoke (setup + boot
        # only, same script) so a platform-specific break surfaces early.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node (+ dependency cache)
        uses: ./.github/actions/node-setup

      - name: Install dependencies
        run: npm ci

      - name: Installer contracts and Node version guard
        run: node --test scripts/install.test.mjs

      # The only place the macOS Seatbelt profile (buildSeatbeltProfile) runs
      # under the real /usr/bin/sandbox-exec: a plugin package launch with the
      # egress proxy, and a shell-tool wrap. The file skips itself elsewhere.
      - name: Seatbelt sandbox end-to-end (sandbox-exec)
        if: runner.os == 'macOS'
        run: npx vitest run --project unit src/security/shell-sandbox.seatbelt.darwin.test.ts

      - name: Setup → doctor → boot → health
        run: bash scripts/smoke-test.sh

  # The Linux counterpart of the Seatbelt step above: bubblewrap and firejail
  # run for real (src/security/shell-sandbox.linux.e2e.test.ts), a plugin
  # package launch through the egress proxy's Unix-socket bridge and a
  # shell-tool wrap, once per runner. Every other job sees the runners faked.
  linux-sandbox:
    name: Linux sandbox end-to-end (bwrap, firejail)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node (+ dependency cache)
        uses: ./.github/actions/node-setup

      - name: Install dependencies
        run: npm ci

      - name: Prepare Ubuntu package sources
        uses: ./.github/actions/ubuntu-apt

      - name: Install bubblewrap and firejail
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap firejail

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor
      # (kernel.apparmor_restrict_unprivileged_userns=1), so bwrap cannot set
      # up its sandbox for the runner user. Hosts like this need an AppArmor
      # profile for bwrap or this sysctl (docs/architecture/MULTI-USER.md,
      # "Operator runbook"); a throwaway CI VM takes the sysctl. firejail is
      # setuid and needs neither.
      - name: Allow unprivileged user namespaces (bwrap)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --version
          firejail --version | head -n 1

      # `required`: a runner that is installed but cannot start a sandbox
      # fails the step instead of being skipped.
      - name: Linux sandbox end-to-end (bwrap, firejail)
        env:
          OCTIPUS_SANDBOX_E2E: required
        run: npx vitest run --project unit src/security/shell-sandbox.linux.e2e.test.ts

  # The PowerShell installer and the batch launcher had no CI at all: three
  # Windows-only breaks (capability installs, missing commands, orphaned shim)
  # shipped unnoticed. This runs the real installer against the checkout and
  # exercises both launcher paths (native batch command + TypeScript hand-over).
  windows:
    name: Smoke (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node (+ dependency cache)
        uses: ./.github/actions/node-setup

      - name: Run install.ps1 against this checkout
        shell: pwsh
        env:
          OCTIPUS_REPO: ${{ github.workspace }}
          OCTIPUS_BRANCH: ${{ github.head_ref || github.ref_name }}
          OCTIPUS_INSTALL_DIR: ${{ runner.temp }}\octipus-app
          OCTIPUS_BIN_DIR: ${{ runner.temp }}\octipus-bin
        run: |
          git -C "$env:OCTIPUS_REPO" branch --force ci-smoke HEAD
          $env:OCTIPUS_BRANCH = 'ci-smoke'
          & scripts/install.ps1 -SkipSetup

      - name: Launcher — batch command and TypeScript hand-over
        shell: pwsh
        run: |
          $octi = "${{ runner.temp }}\octipus-bin\octi.cmd"
          & $octi help; if ($LASTEXITCODE -ne 0) { throw 'octi help failed' }
          & $octi version; if ($LASTEXITCODE -ne 0) { throw 'octi version (TypeScript hand-over) failed' }
          # doctor exits 1 on a fresh install (no .env yet); assert it produced a
          # real report rather than its exit code, and leave the step at 0.
          $out = (& $octi doctor --json) -join "`n"
          $report = $out.Substring([Math]::Max(0, $out.IndexOf('{'))) | ConvertFrom-Json
          if (-not $report.checks -or $report.checks.Count -lt 5) { throw "octi doctor produced no report:`n$out" }
          Write-Host "doctor: $($report.summary.ok) ok, $($report.summary.warn) warn, $($report.summary.fail) fail"
          $global:LASTEXITCODE = 0
