name: Install smoke

# The single highest-value test we can run: it exercises exactly what every new
# self-hoster does first — `octi setup` → `octi doctor` → boot the backend — with
# zero external services (embedded PGlite). See scripts/smoke-test.sh.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: install-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # ubuntu is the primary target; macOS is a cross-OS smoke (setup + boot
        # only, same script) so a platform-specific break surfaces early.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup → doctor → boot → health
        run: bash scripts/smoke-test.sh
