name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Pushes that only touch prose or images have nothing for the JS/TS
    # extractor to scan. docs/ also holds .mjs/.html/.py, so only file types
    # are ignored, never the directory. pull_request is left unfiltered:
    # CodeQL is a required check, and a skipped run would block the PR.
    paths-ignore:
      - '**/*.md'
      - '**/*.png'
      - '**/*.svg'
  schedule:
    # Weekly, Mondays 06:17 UTC (off-peak, avoids the top-of-hour rush).
    - cron: '17 6 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    # Full-main extraction, queries and GitHub SARIF processing exceeded 15m.
    # Keep the full scan and allow time for server-side result processing.
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # JS/TS is interpreted — no compilation step is required.
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
