name: Release

# Tag-driven release. Push a `v*` tag (e.g. `v0.3` or `v0.3.0`) to:
#   1. gate on the core CI checks (typecheck · lint · test),
#   2. sync package versions to the tag,
#   3. cut a GitHub Release with notes extracted from CHANGELOG.md,
#   4. publish the mcp-server npm package (only when NPM_TOKEN is configured).
#
# CHANGELOG curation stays manual — this only reads it.

on: # zizmor: ignore[cache-poisoning]
  # Accepted: release runs only on maintainer-pushed `v*` tags or maintainer
  # dispatches for an existing tag, and the npm
  # cache is keyed on the committed package-lock.json hash — a PR can't poison a cache
  # this workflow would restore. Revisit if untrusted contributors can trigger
  # release-like publishing.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to recover without moving it (e.g. v0.3)'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm publish --provenance (OIDC attestation)

jobs:
  release:
    name: Release ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Surface NPM_TOKEN presence as a plain env flag — `secrets.*` isn't usable
    # directly in a step-level `if`, but env is.
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0 # full history so the tagged CHANGELOG is present
          persist-credentials: false

      - name: Setup Node (+ dependency cache)
        uses: ./.github/actions/node-setup

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v7
        with:
          node-version: '24.19'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # ── Release gate: the core CI checks must pass before we publish ──
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
        env:
          MASTER_KEY: ci-dummy-master-key-for-unit-tests-only-1234567890
          JWT_SECRET: ci-dummy-jwt-secret-for-unit-tests-only-1234567890
          SESSION_SECRET: ci-dummy-session-secret-for-unit-tests-only-1234567890

      # ── Version sync + release notes ──
      # The tag is passed through an env var, never interpolated
      # directly into the shell — otherwise a crafted tag name could inject
      # commands into these `run:` steps (zizmor: template-injection).
      # Use the workflow revision's release helper so a corrected workflow can
      # recover an existing tag. Application code and tests stay at that tag.
      - name: Check out release tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: scripts/sync-version.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Sync package versions to the tag
        run: npx tsx .release-tooling/scripts/sync-version.ts "$RELEASE_TAG" "$GITHUB_WORKSPACE"

      - name: Extract release notes from CHANGELOG
        run: |
          npx tsx scripts/changelog-extract.ts "$RELEASE_TAG" > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      # ── Build + package the mcp-server npm artifact ──
      - name: Build mcp-server
        working-directory: mcp-server
        run: |
          npm ci
          npm run build
          npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            mcp-server/*.tgz

      # ── Publish mcp-server to npm (skipped when NPM_TOKEN isn't set) ──
      - name: Publish mcp-server to npm
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        working-directory: mcp-server
        # --provenance publishes a signed build-provenance attestation (via the
        # id-token permission above), so consumers can verify the package was
        # built by this repository's workflow. In manual recovery, the workflow
        # revision differs from the explicitly checked-out release tag; inspect
        # both revisions in the run rather than treating them as identical.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
