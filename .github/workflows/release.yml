name: Release

# Tag-driven release. Push a `v*` tag (e.g. `v0.2.0`) to:
#   1. gate on the core CI checks (typecheck · lint · test),
#   2. sync package versions to the tag,
#   3. cut a GitHub Release with notes extracted from CHANGELOG.md,
#   4. publish the mcp-server npm package (only when NPM_TOKEN is configured).
#
# CHANGELOG curation stays manual — this only reads it.

on: # zizmor: ignore[cache-poisoning]
  # Accepted: release runs only on maintainer-pushed `v*` tags, and the Bun
  # cache is keyed on the committed bun.lock hash — a PR can't poison a cache
  # this workflow would restore. Revisit if untrusted contributors can trigger
  # release-like publishing.
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm publish --provenance (OIDC attestation)

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Surface NPM_TOKEN presence as a plain env flag — `secrets.*` isn't usable
    # directly in a step-level `if`, but env is.
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the tagged CHANGELOG is present
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # ── Release gate: the core CI checks must pass before we publish ──
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
        env:
          MASTER_KEY: ci-dummy-master-key-for-unit-tests-only-1234567890
          JWT_SECRET: ci-dummy-jwt-secret-for-unit-tests-only-1234567890
          SESSION_SECRET: ci-dummy-session-secret-for-unit-tests-only-1234567890

      # ── Version sync + release notes ──
      # `github.ref_name` is passed through an env var, never interpolated
      # directly into the shell — otherwise a crafted tag name could inject
      # commands into these `run:` steps (zizmor: template-injection).
      - name: Sync package versions to the tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: bun run scripts/sync-version.ts "$REF_NAME"

      - name: Extract release notes from CHANGELOG
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          bun run scripts/changelog-extract.ts "$REF_NAME" > RELEASE_NOTES.md
          echo "----- release notes -----"
          cat RELEASE_NOTES.md

      # ── Build + package the mcp-server npm artifact ──
      - name: Build mcp-server
        working-directory: mcp-server
        run: |
          bun install --frozen-lockfile
          bun run build
          npm pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            mcp-server/*.tgz

      # ── Publish mcp-server to npm (skipped when NPM_TOKEN isn't set) ──
      - name: Publish mcp-server to npm
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        working-directory: mcp-server
        # --provenance publishes a signed build-provenance attestation (via the
        # id-token permission above), so consumers can verify the package was
        # built from this repo's tagged CI. Public repo + GitHub Actions = free.
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
