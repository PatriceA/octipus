name: Plugin contract

# Check the legacy plugin contract (@octipus/plugin-sdk) and the converter on
# the fixture under tests/fixtures/legacy-plugin: manifest schema, apiVersion
# compatibility, module shape, a fixture dry-run of each declared tool, and
# that `octi plugin convert` turns it into a plugin package. Legacy plugins
# load from ~/.octipus/legacy-plugins, never from the repository, so there is
# no extensions/ directory to scan; plugins/reader is the example plugin and
# is covered by the unit tests.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: plugin-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate the legacy plugin fixture and its conversion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node (+ npm cache)
        uses: ./.github/actions/node-setup

      - name: Install dependencies
        run: npm ci

      - name: Validate the legacy fixture
        run: npx tsx scripts/plugin.ts validate tests/fixtures/legacy-plugin

      - name: Convert the legacy fixture to a plugin package
        run: |
          set -e
          out="$RUNNER_TEMP/legacy-plugin-package"
          npx tsx scripts/plugin.ts convert tests/fixtures/legacy-plugin --out "$out"
          test -f "$out/octipus-plugin.json"
          test -f "$out/server.mjs"
