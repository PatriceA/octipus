name: Plugin contract

# Validate every plugin under extensions/ against the published contract
# (@octipus/plugin-sdk): manifest schema, apiVersion compatibility, module
# shape, and a fixture dry-run of each declared tool. WS3's "plugin contract
# shards" at our scale.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: plugin-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate extensions/*
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun (+ dependency cache)
        uses: ./.github/actions/bun-setup

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate each plugin
        run: |
          set -e
          shopt -s nullglob
          found=0
          for manifest in extensions/*/plugin.json; do
            dir="$(dirname "$manifest")"
            found=1
            echo "── $dir ──"
            bun run scripts/plugin.ts validate "$dir"
          done
          if [ "$found" -eq 0 ]; then
            echo "No plugins under extensions/ — nothing to validate."
          fi
