name: Integration

# Runs the INTEGRATION=1 suite — the tests gated behind
# `describe.skipIf(!isIntegration)` that need a real Postgres (so RLS policies
# actually fire) and a real Redis/Valkey. These cover the multi-tenant security
# boundaries (RLS enforcement, rate limiting, SCIM auth refusal, org membership)
# and every repository test, none of which run in the unit-test `CI` workflow.
#
# The heavy lifting lives in scripts/test-integration.ts, which brings up
# docker-compose.test.yml (pgvector + valkey, both ephemeral/tmpfs), migrates
# the test DB, runs `bun test` with INTEGRATION=1, and tears the stack down.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration (postgres · valkey)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dummy 32+ char secrets satisfy config-load validation — the same reason
    # the `CI` workflow sets them. Integration tests mock LLM providers, so no
    # real API keys are needed; only Docker (Postgres + Valkey) is required.
    env:
      MASTER_KEY: ci-dummy-master-key-for-integration-tests-1234567890
      JWT_SECRET: ci-dummy-jwt-secret-for-integration-tests-1234567890
      SESSION_SECRET: ci-dummy-session-secret-for-integration-tests-1234567890
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Brings up Postgres + Valkey, migrates, runs INTEGRATION=1 tests, and
      # tears the stack down on exit (pass or fail). ubuntu-latest ships Docker
      # + Compose v2, so no extra setup is required.
      - name: Integration tests
        run: bun run scripts/test-integration.ts
