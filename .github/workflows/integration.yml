name: Integration

# Runs the INTEGRATION=1 suite — the tests gated behind
# `describe.skipIf(!isIntegration)` that need a real Postgres (so RLS policies
# actually fire). These cover the multi-tenant security
# boundaries (RLS enforcement, rate limiting, SCIM auth refusal, org membership)
# and every repository test, none of which run in the unit-test `CI` workflow.
#
# The heavy lifting lives in scripts/test-integration.ts, which brings up
# docker-compose.test.yml (pgvector, ephemeral/tmpfs), migrates
# the test DB, runs the suite with INTEGRATION=1, and tears the stack down.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: Integration (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Dummy 32+ char secrets satisfy config-load validation — the same reason
    # the `CI` workflow sets them. Integration tests mock LLM providers, so no
    # real API keys are needed; only Docker (Postgres) is required.
    env:
      MASTER_KEY: ci-dummy-master-key-for-integration-tests-1234567890
      JWT_SECRET: ci-dummy-jwt-secret-for-integration-tests-1234567890
      SESSION_SECRET: ci-dummy-session-secret-for-integration-tests-1234567890
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node (+ npm cache)
        uses: ./.github/actions/node-setup

      - name: Install dependencies
        run: npm ci

      # Brings up Postgres, migrates, runs INTEGRATION=1 tests, and
      # tears the stack down on exit (pass or fail). ubuntu-latest ships Docker
      # + Compose v2, so no extra setup is required.
      - name: Build CLI tool bridge (spawned CLI runs resolve mcp-server/dist)
        run: npm ci && npm run build
        working-directory: mcp-server

      # The browser is cached per Playwright version; the OS libraries come
      # from apt. `--with-deps` runs apt-get update, which also pulls Google's
      # Chrome index shipped in the runner image (unused: Playwright brings its
      # own browser) and has been slow or broken upstream, so drop it first.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser for page extraction tests
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium

      - name: Integration tests
        run: npx tsx scripts/test-integration.ts
