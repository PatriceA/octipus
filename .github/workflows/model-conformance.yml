name: Model Conformance Tests

on:
  push:
    paths:
      - 'src/models/providers/**'
      - 'src/models/testing/**'
  pull_request:
    paths:
      - 'src/models/providers/**'
      - 'src/models/testing/**'
  workflow_dispatch:

# `actions/github-script` in the "Post PR comment" step needs write access to
# pull-requests; without this block the default GITHUB_TOKEN is read-only on
# PR-from-fork events and the job fails with HTTP 403 even when the
# conformance run itself succeeds.
permissions:
  contents: read
  pull-requests: write

jobs:
  conformance:
    name: Run conformance tests (Ollama)
    runs-on: ubuntu-latest

    services:
      # PostgreSQL required by model registry
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: octipus
          POSTGRES_PASSWORD: octipus
          POSTGRES_DB: octipus
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://octipus:octipus@localhost:5432/octipus
      # Cloud provider keys are optional — tests skip if not set
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        # `db:push` was never defined in package.json; the actual migration
        # script is `db:migrate`. The conformance run does not strictly need
        # the schema (it just hits Ollama), but keeping the step makes the
        # registry-loading code path realistic.
        run: bun run db:migrate
        continue-on-error: true

      - name: Check Ollama availability
        id: ollama_check
        run: |
          if command -v ollama &>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Ollama not available in this runner — conformance tests will be skipped."
          fi

      - name: Start Ollama and pull test model
        if: steps.ollama_check.outputs.available == 'true'
        run: |
          ollama serve &
          sleep 5
          # Pull a small model for CI — override with OLLAMA_TEST_MODEL secret if desired
          ollama pull "${OLLAMA_TEST_MODEL:-tinyllama}"
        env:
          OLLAMA_TEST_MODEL: ${{ secrets.OLLAMA_TEST_MODEL }}

      - name: Run conformance tests (JSON output)
        id: conformance
        run: |
          if [ "${{ steps.ollama_check.outputs.available }}" = "true" ]; then
            bun run src/models/testing/run.ts \
              --provider=ollama \
              --model="${OLLAMA_TEST_MODEL:-tinyllama}" \
              --json \
              > conformance-report.json 2>&1 || true
          else
            echo '{"timestamp":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","results":[],"summary":{"total":0,"passed":0,"failed":0,"skipped":0,"durationMs":0},"skipped_reason":"Ollama not available"}' \
              > conformance-report.json
          fi
        env:
          OLLAMA_TEST_MODEL: ${{ secrets.OLLAMA_TEST_MODEL }}

      - name: Upload conformance report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report-${{ github.run_id }}
          path: conformance-report.json
          retention-days: 30

      - name: Parse and summarize results
        id: summary
        if: always()
        run: |
          if [ -f conformance-report.json ]; then
            PASSED=$(bun -e "const r=require('./conformance-report.json');console.log(r.summary?.passed??0)")
            FAILED=$(bun -e "const r=require('./conformance-report.json');console.log(r.summary?.failed??0)")
            SKIPPED=$(bun -e "const r=require('./conformance-report.json');console.log(r.summary?.skipped??0)")
            SKIPPED_REASON=$(bun -e "const r=require('./conformance-report.json');console.log(r.skipped_reason??'')")
            echo "passed=$PASSED" >> "$GITHUB_OUTPUT"
            echo "failed=$FAILED" >> "$GITHUB_OUTPUT"
            echo "skipped=$SKIPPED" >> "$GITHUB_OUTPUT"
            echo "skipped_reason=$SKIPPED_REASON" >> "$GITHUB_OUTPUT"
          fi

      - name: Post PR comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.summary.outputs.passed }}' || '0';
            const failed = '${{ steps.summary.outputs.failed }}' || '0';
            const skipped = '${{ steps.summary.outputs.skipped }}' || '0';
            const skippedReason = '${{ steps.summary.outputs.skipped_reason }}';

            let status = ':white_check_mark: All conformance tests passed';
            if (skippedReason) {
              status = `:information_source: Conformance tests skipped — ${skippedReason}`;
            } else if (parseInt(failed) > 0) {
              status = `:x: ${failed} conformance test(s) failed`;
            }

            const body = [
              '## Model Conformance Report',
              '',
              status,
              '',
              `| Passed | Failed | Skipped |`,
              `|--------|--------|---------|`,
              `| ${passed} | ${failed} | ${skipped} |`,
              '',
              `[Download full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            ].join('\n');

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if tests failed
        if: steps.summary.outputs.failed != '' && steps.summary.outputs.failed != '0'
        run: |
          echo "::error::${{ steps.summary.outputs.failed }} conformance test(s) failed. See the report artifact for details."
          exit 1
