name: Semgrep

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep (typescript · security-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pinned image, not `latest`, so a Semgrep release cannot break CI for
    # unrelated PRs (same reasoning as pinning setup-bun).
    container:
      image: semgrep/semgrep:1.86.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Blocking: `semgrep ci` exits non-zero on any blocking finding. Findings
      # were triaged (0 blocking on the current tree) so this now gates PRs.
      - name: Run Semgrep
        run: semgrep ci --config p/typescript --config p/security-audit
