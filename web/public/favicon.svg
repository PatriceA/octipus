<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#0B1120"/>
  <!-- Brain/Circuit icon -->
  <g transform="translate(256,256)" stroke="url(#bg)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Central circle -->
    <circle cx="0" cy="0" r="40" fill="#06b6d4" fill-opacity="0.2" stroke="url(#bg)"/>
    <!-- Top branch -->
    <line x1="0" y1="-40" x2="0" y2="-100"/>
    <circle cx="0" cy="-115" r="15" fill="#22d3ee"/>
    <!-- Top-right branch -->
    <line x1="28" y1="-28" x2="75" y2="-75"/>
    <circle cx="87" cy="-87" r="15" fill="#34d399"/>
    <!-- Right branch -->
    <line x1="40" y1="0" x2="100" y2="0"/>
    <circle cx="115" cy="0" r="15" fill="#22d3ee"/>
    <!-- Bottom-right branch -->
    <line x1="28" y1="28" x2="75" y2="75"/>
    <circle cx="87" cy="87" r="15" fill="#34d399"/>
    <!-- Bottom branch -->
    <line x1="0" y1="40" x2="0" y2="100"/>
    <circle cx="0" cy="115" r="15" fill="#22d3ee"/>
    <!-- Bottom-left branch -->
    <line x1="-28" y1="28" x2="-75" y2="75"/>
    <circle cx="-87" cy="87" r="15" fill="#34d399"/>
    <!-- Left branch -->
    <line x1="-40" y1="0" x2="-100" y2="0"/>
    <circle cx="-115" cy="0" r="15" fill="#22d3ee"/>
    <!-- Top-left branch -->
    <line x1="-28" y1="-28" x2="-75" y2="-75"/>
    <circle cx="-87" cy="-87" r="15" fill="#34d399"/>
    <!-- Inner dot -->
    <circle cx="0" cy="0" r="8" fill="#22d3ee"/>
  </g>
</svg>
