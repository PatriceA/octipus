<header class="preview-bar"><div class="preview-brand">Octipus / Design studies <span>Interactive concepts · illustrative data</span></div><div class="directions" role="group" aria-label="Design direction"><button data-direction="a" aria-pressed="true">01 · Calm workspace</button><button data-direction="b" aria-pressed="false">02 · Companion first</button><button data-direction="c" aria-pressed="false">03 · Project desk · v2</button></div><button class="preview-link" data-view="structure">Structure & design rules ↗</button></header>
<div class="frame" id="frame">

<nav class="nav-section" aria-label="Daily work"><span class="eyebrow">Workspace</span><button class="nav-item active" data-view="home" title="Home" aria-current="page"><svg class="icon"><use href="#home"/></svg><span class="nav-label">Home</span></button><button class="nav-item" data-action="companion" title="Companion"><svg class="icon"><use href="#spark"/></svg><span class="nav-label">Companion</span></button><button class="nav-item" data-action="sessions" title="Sessions"><svg class="icon"><use href="#chat"/></svg><span class="nav-label">Sessions</span><span class="nav-count">3</span></button><button class="nav-item" data-action="tasks" title="To-dos"><svg class="icon"><use href="#tasks"/></svg><span class="nav-label">To-dos</span></button><button class="nav-item" data-action="activity" title="Activity"><svg class="icon"><use href="#activity"/></svg><span class="nav-label">Activity</span><span class="nav-count">1</span></button></nav>

<div class="nav-bottom"><button class="nav-item" data-view="settings" title="Settings"><svg class="icon"><use href="#settings"/></svg><span class="nav-label">Settings</span></button><button class="nav-item" id="collapse" title="Collapse navigation" aria-label="Collapse navigation" aria-expanded="true"><svg class="icon" id="collapse-icon"><use href="#panel"/></svg><span class="nav-label">Collapse menu</span></button><div class="sidebar-foot"><div class="flex"><span class="avatar">PA</span><div>Patrice<span style="display:block;font-size:10px;margin-top:3px">Personal workspace</span></div></div></div></div></aside>
<main class="main"><div class="topbar"><div class="flex"><button class="icon-button mobile-menu" aria-label="Open navigation"><svg class="icon"><use href="#panel"/></svg></button><span class="workspace-label"><span class="dot"></span>Personal workspace<span class="workspace-extra muted">/ <span id="location-label">Home</span></span></span></div><div class="top-tools"><button class="search-button" data-action="search" aria-label="Search settings"><svg class="icon" style="width:14px;height:14px"><use href="#search"/></svg><span class="search-label">Search settings</span><kbd>⌘ K</kbd></button><span class="budget">Today · $2.84 known cost</span><button class="icon-button" data-action="activity" aria-label="Activity and decisions"><svg class="icon"><use href="#bell"/></svg></button><span class="avatar" aria-label="Patrice">PA</span></div></div><div id="content"></div></main></div>
<div class="dialog" id="dialog" hidden role="dialog" aria-modal="true" aria-labelledby="dialog-title"><section class="dialog-box"><button class="icon-button dialog-close" aria-label="Close preview"><svg class="icon"><use href="#close"/></svg></button><div id="dialog-body"></div></section></div>
<script>
const icon = name => `<svg class="icon" aria-hidden="true"><use href="#${name}"/></svg>`;
const content = document.querySelector('#content'), frame = document.querySelector('#frame');
const initial = new URLSearchParams(location.search);
const state = { direction:['a','b','c'].includes(initial.get('direction'))?initial.get('direction'):'c', view:['home','settings','structure'].includes(initial.get('view'))?initial.get('view'):'home', setting:null, filter:'', projectTab:'all', selectedProject:0, companionDraft:'' };
try { if (localStorage.getItem('octipus.design-preview.collapsed') === 'true') frame.classList.add('collapsed'); } catch {}
const projects = [
 {name:'Life²',initial:'L²',description:'Release checks are running. Phone testing comes next.',status:'Working',kind:'',time:'Updated 2 min ago',state:'working',stage:'Release checks'},
 {name:'Solar System Map',initial:'SS',description:'Choose when to restart the service for the update.',status:'Needs you',kind:'amber',time:'Waiting 18 min',state:'waiting',stage:'Ready to deploy'},
 {name:'Dev: yetano',initial:'ye',description:'The performance comparison is ready to read.',status:'Ready to read',kind:'neutral',time:'Updated 1 hr ago',state:'ready',stage:'Research complete'}
];
const footer = `<div class="footer-note"><span>Illustrative snapshot · Not connected to your live sessions</span><button data-action="system">System status & usage ${icon('arrow')}</button></div>`;
const note = () => `<div class="concept-note"><span>${({a:'01 / CALM WORKSPACE · A balanced starting point',b:'02 / COMPANION FIRST · A conversation with your whole workspace',c:'03 / PROJECT DESK · Progress before conversation'})[state.direction]}</span><button data-view="structure">See the structure behind this design</button></div>`;
const head = (title,subtitle,action=true) => `<header class="page-head"><div><div class="eyebrow">Monday, 9 November</div><h1>${title}</h1><p>${subtitle}</p></div>${action?`<button class="primary" data-action="new">${icon('plus')} New work</button>`:''}</header>`;
const sessionRows = () => projects.map((p,i)=>`<button class="session-row" data-project="${i}"><span class="project-icon">${p.initial}</span><div><strong>${p.name}</strong><p>${p.description}</p></div><div class="meta"><span class="badge ${p.kind}">${p.status==='Working'?'<span class="dot"></span>':''}${p.status}</span><div>${p.time}</div></div>${icon('arrow')}</button>`).join('');
const attention = () => `<section class="card attention"><div class="section-title"><h2>Needs your attention</h2><span class="attention-count">1</span></div><div class="attention-label">${icon('clock')} SOLAR SYSTEM MAP</div><h3>When should the update go live?</h3><p>The work is ready. Restarting will briefly interrupt the service.</p><button class="text-button" data-action="decision">Review the decision ${icon('arrow')}</button></section>`;
function calm(){return `${head('Welcome back, Patrice.','One decision needs you. Your other work is moving.')}<div class="home-grid"><section class="card companion-card"><div><div class="eyebrow">Your companion</div><img class="mascot" src="../companion-mark.svg" alt=""><h2>What shall we<br> work on next?</h2><p>Talk through an idea, ask about your projects, or hand over the next step.</p></div><div class="actions"><button class="primary" data-action="companion">${icon('spark')} Open Companion</button><button class="text-button" data-action="new">Start a separate session ${icon('arrow')}</button></div></section>${attention()}<section class="card work-card"><div class="section-title"><h2>Continue your work</h2><button class="text-button" data-action="sessions">All sessions ${icon('arrow')}</button></div>${sessionRows()}</section></div><div class="bottom-grid"><section class="card"><div class="section-title"><h2>Worth a look</h2><button class="text-button" data-action="activity">All activity ${icon('arrow')}</button></div><div class="updates"><span class="check">${icon('check')}</span><div>Yetano performance comparison is ready.<p>Research finished · 1 hour ago</p></div></div><div class="updates"><span class="check">${icon('check')}</span><div>BPMN editor changes passed review.<p>Review finished · 2 hours ago</p></div></div></section><section class="card"><div class="section-title"><h2>For later</h2><button class="text-button" data-action="idea">${icon('plus')} Save an idea</button></div><div class="idea">${icon('tasks')}<span>Compare local model performance</span><small>Queued</small></div><div class="idea">${icon('tasks')}<span>Refresh website statistics</span><small>Queued</small></div><button class="text-button" data-action="tasks">Open to-dos ${icon('arrow')}</button></section></div>${footer}${note()}`}
function companion(){return `${head('What’s on your mind, Patrice?','Start here. Your companion keeps the bigger picture in view.')}<div class="conversation-grid"><section class="conversation-hero"><div class="companion-presence"><img src="../companion-mark.svg" alt=""><div><strong>Your companion</strong><p>Across your projects, with you.</p></div></div><h2>Life² is moving forward.<br>One decision is waiting for you.</h2><p class="muted">The Solar System Map update is ready. You only need to choose when it goes live. Everything else can wait.</p><form class="composer" id="companion-form"><div class="composer-shell"><input name="prompt" aria-label="Message Companion" value="${escapeHtml(state.companionDraft)}" placeholder="What would you like to do?" autocomplete="off"><button class="primary" aria-label="Send preview message">${icon('arrow')}</button></div><div class="suggestions"><button type="button" data-action="briefing">Catch me up</button><button type="button" data-action="idea">Save an idea for later</button><button type="button" data-action="decision">Show the decision</button></div></form></section><aside class="card"><div class="section-title"><h2>Your sessions</h2><button class="text-button" data-action="sessions">View all ${icon('arrow')}</button></div>${projects.map((p,i)=>`<button class="compact-session" data-project="${i}"><span class="badge ${p.kind}">${p.status}</span><h3>${p.name}</h3><p>${p.description}</p></button>`).join('')}</aside></div><section class="inline-attention">${icon('clock')}<div><strong>Solar System Map · Choose a restart time</strong><p>A short interruption is expected during the update.</p></div><button class="text-button" data-action="decision">Review ${icon('arrow')}</button></section><div class="quiet-activity">${icon('check')}<span>2 new results are ready to read.</span><button data-action="activity">View results</button></div>${footer}${note()}`}
const deskDetails = [
 {now:'Running release checks',last:'Automated tests passed. Phone acceptance is still unverified.',next:'Check the connected phone after the release checks finish.',change:'Phone acceptance was added after review.',action:'View current work',events:[['14:32','Release checks started','working'],['14:28','Automated tests passed','done'],['14:20','Plan updated: phone acceptance added','change']]},
 {now:'Waiting for your restart decision',last:'The configuration backup is verified. The update has not been deployed.',next:'Choose a restart time. Deployment and health checks follow.',change:'Deployment scope unchanged since the last review.',action:'Review decision',events:[['14:14','Restart decision requested','waiting'],['14:12','Configuration backup verified','done'],['14:08','Update prepared; deployment still pending','done']]},
 {now:'Research findings ready to read',last:'The performance comparison is saved in the session.',next:'Read the findings and decide whether to run another measurement.',change:'Research finished. No performance configuration was changed.',action:'Read findings',events:[['13:32','Comparison saved for you to read','ready'],['13:26','Measurements compared','done'],['13:10','Research started','done']]}
];
function desk(){
 const visible=projects.filter(p=>state.projectTab==='all'||p.state===state.projectTab);
 const selected=projects[state.selectedProject], detail=deskDetails[state.selectedProject];
 return `<header class="desk-heading"><div><div class="eyebrow">PERSONAL WORKSPACE</div><h1>Workspace</h1></div><button class="primary" data-action="new">${icon('plus')} New session</button></header>
 <section class="companion-brief" aria-label="Companion supervision"><img src="../companion-mark.svg" alt=""><div><div class="brief-title"><strong>Companion</strong><span class="follow-label"><span class="dot"></span>Following 2 sessions</span></div><p>Life² is working. Solar System Map needs your restart decision.</p></div><button class="primary" data-action="companion">Open Companion ${icon('arrow')}</button></section>
 <div class="desk-work-grid"><section class="session-surface" aria-label="Session states"><header class="session-heading"><h2>Sessions</h2><span class="snapshot-time">Example snapshot · 14:32</span></header><div class="work-filters" role="group" aria-label="Filter sessions">${[['all','All',3],['working','Working',1],['waiting','Needs you',1],['ready','Ready',1]].map(([id,label,count])=>`<button data-project-tab="${id}" aria-pressed="${state.projectTab===id}" class="${state.projectTab===id?'active':''} ${id}">${label}<span>${count}</span></button>`).join('')}</div>
 <div class="work-entries">${visible.map(p=>{const i=projects.indexOf(p),d=deskDetails[i];return `<article class="work-entry ${p.state} ${state.selectedProject===i?'selected':''}"><button class="entry-select" data-select-project="${i}" aria-label="Inspect ${p.name}" aria-pressed="${state.selectedProject===i}"><span class="entry-mark">${p.initial}</span><span class="entry-name">${p.name}<small>${p.time}</small></span><span class="badge ${p.kind}"><span class="dot"></span>${p.status}</span></button><div class="entry-content"><h3>${d.now}</h3><p>${d.last}</p><div class="entry-next"><span>Next</span>${d.next}</div></div><div class="entry-footer"><span>${p.state==='working'?icon('activity'):p.state==='waiting'?icon('clock'):icon('check')}${p.state==='working'?'Companion is following':p.state==='waiting'?'Waiting for you':'Result saved'}</span><button class="text-button" ${p.state==='waiting'?'data-action="decision"':`data-project="${i}"`}>${p.state==='waiting'?'Review decision':p.state==='ready'?'Read findings':'Open session'} ${icon('arrow')}</button></div></article>`}).join('')}</div><button class="all-sessions" data-action="sessions">View all sessions ${icon('arrow')}</button></section>
 <aside class="work-inspector" aria-label="Selected session"><header><span class="eyebrow">SELECTED SESSION</span><div class="flex between"><h2>${selected.name}</h2><span class="badge ${selected.kind}">${selected.status}</span></div></header><section class="inspector-now"><div class="eyebrow">CURRENT ACTIVITY</div><h3>${detail.now}</h3><p>${detail.next}</p></section><section class="inspector-history"><div class="section-title"><h3>Latest changes</h3><button class="text-button" data-project="${state.selectedProject}">History ${icon('arrow')}</button></div><ol>${detail.events.map(([time,label,kind])=>`<li class="event-${kind}"><time>${time}</time><span>${label}</span></li>`).join('')}</ol></section><section class="plan-change">${icon('tasks')}<div><strong>${state.selectedProject===0?'Plan updated':'Scope note'}</strong><p>${detail.change}</p><button class="text-button" data-action="plan">View current plan ${icon('arrow')}</button></div></section><div class="inspector-controls"><button class="secondary" data-project="${state.selectedProject}">Open session ${icon('arrow')}</button><button class="text-button" data-action="companion">Ask Companion about this</button></div></aside></div>
 <form class="companion-command" id="companion-form"><span class="command-mark">${icon('spark')}</span><input aria-label="Message Companion" value="${escapeHtml(state.companionDraft)}" placeholder="Ask Companion, start work, or save an idea…" autocomplete="off"><button type="button" data-action="idea" class="command-idea" title="Save an idea for later">${icon('tasks')}<span>Save idea</span></button><button class="primary" aria-label="Send preview message">${icon('arrow')}</button></form><div class="desk-bottomline"><span>Illustrative data · No live actions</span><button data-action="tasks">2 to-dos for later</button><button data-action="system">Usage & system status</button></div>`;
}

const categories=[
 {name:'You & your workspace',icon:'user',description:'Make this feel like your place.',items:[['Profile & appearance','name theme persona language'],['Notifications','alerts email sound'],['Voice & mobile','speech calls phone app'],['People & spaces','teams roles users remote workspaces']]},
 {name:'Companion & automation',icon:'spark',description:'Choose how Octipus helps and when it acts.',items:[['Companion','model supervision budget autonomy'],['Heartbeat','background check interval todos inbox'],['Pipelines & schedules','triggers hooks routines'],['Recovery','uncertain outcome automatically approve']]},
 {name:'Models & knowledge',icon:'cpu',description:'The intelligence and context behind the work.',items:[['Models & providers','ollama openrouter my models API'],['Topic assignments','routing agent role model'],['Skills & memory','instructions recall knowledge'],['Knowledge sources','documents indexing embeddings']]},
 {name:'Connected accounts',icon:'connect',description:'Your services, inboxes, and channels.',items:[['Accounts & services','github appwrite integrations'],['Mailboxes & calendars','imap smtp google workspace email'],['Chat channels','telegram slack teams whatsapp'],['MCP & extensions','tools plugins n8n']]},
 {name:'Machines & access',icon:'shield',description:'Where work runs and what it can reach.',items:[['Workspace folders','project roots directories files'],['Environments & Access','host sandbox ssh CLI gh oc tools workstation'],['Permissions & exceptions','allow deny overnight approvals scoped'],['Secrets & API tokens','credentials vault keys']]},
 {name:'System',icon:'settings',description:'Installation controls, clearly separated.',items:[['Features & modules','enabled capabilities'],['Usage & limits','cost tokens quotas budgets'],['Health & updates','status diagnostics services version'],['Advanced configuration','logging gateway api low level']]}
];
function settings(){return `${head('Settings','Six clear places. Search when you already know what you need.',false)}<label class="settings-search">${icon('search')}<input id="settings-search" type="search" placeholder="Find a setting — try “heartbeat”, “gh”, or “email”" aria-label="Find a setting" value="${escapeHtml(state.filter)}"><span class="small muted">Settings only</span></label><div id="settings-results">${settingResults()}</div>${note()}`}
function settingResults(){const q=state.filter.trim().toLowerCase();const terms=q.split(/[^a-z0-9]+/).filter(Boolean);const groups=categories.map(g=>({...g,items:g.items.filter(([name,keys])=>{const words=(g.name+' '+name+' '+keys).toLowerCase().split(/[^a-z0-9]+/);return terms.every(term=>words.some(word=>word.startsWith(term)))} )})).filter(g=>g.items.length);return `${q?`<p class="result-count">${groups.reduce((n,g)=>n+g.items.length,0)} matching destinations</p>`:''}<div class="settings-grid">${groups.map(g=>`<section class="card settings-group"><div class="group-icon">${icon(g.icon)}</div><h2 style="font-size:16px">${g.name}</h2><p>${g.description}</p>${g.items.map(([name])=>`<button class="setting-link" data-setting="${escapeHtml(name)}">${name}${icon('arrow')}</button>`).join('')}</section>`).join('')||'<p class="empty-filter">No matching settings. Try a broader word such as “access” or “models”.</p>'}</div>`}
function detail(){let name=state.setting;const cat=categories.find(g=>g.items.some(([n])=>n===name));const common=`<div class="breadcrumb"><button data-view="settings">Settings</button> / ${cat.name} / ${name}</div><header class="page-head"><div><h1>${name}</h1><p>${cat.description}</p></div></header>`;let rows='';if(name==='Heartbeat')rows=`<div class="setting-row"><div><h3>Check in on my work</h3><p>Look for queued to-dos and important changes without starting a chat for every check.</p></div><button class="toggle" role="switch" aria-checked="true" aria-label="Check in on my work"></button></div><div class="setting-row"><div><h3>Check every</h3><p>One schedule, managed here. Runtime status is a link to diagnostics, not another switch.</p></div><button class="secondary" data-action="interval">30 minutes ${icon('clock')}</button></div><div class="setting-row"><div><h3>Only interrupt me when needed</h3><p>Keep routine activity quiet. Show decisions and completed work together in Activity.</p></div><button class="toggle" role="switch" aria-checked="true" aria-label="Only interrupt me when needed"></button></div>`;else if(name==='Environments & Access') rows=`<div class="setting-row"><div><h3>Workstation automation</h3><p>Use installed programs, existing logins, and SSH access as your workstation account.</p></div><span class="badge">Default environment</span></div><div class="setting-row"><div><h3>Where this runs</h3><p>patrice@patrice-AI-machine · Host account access.<br>Projects may use other machines through SSH.</p></div><button class="secondary" data-action="environment">Review access</button></div><div class="setting-row"><div><h3>Permissions & exceptions</h3><p>See explicit denials and approval requirements in one place. Program availability and permission to act stay distinct.</p></div><button class="text-button" data-setting="Permissions & exceptions">View exceptions ${icon('arrow')}</button></div>`;else if(name==='Companion')rows=`<div class="setting-row"><div><h3>Companion model</h3><p>A fixed model for your cross-project companion. Topic assignments remain the home for project agent models.</p></div><button class="secondary" data-action="model">Choose model</button></div><div class="setting-row"><div><h3>Supervision & budget</h3><p>Choose which sessions it follows, its spending limit, and how much it can do on its own.</p></div><button class="secondary" data-action="supervision">Review</button></div><div class="setting-row"><div><h3>Heartbeat</h3><p>Periodic checks have their own schedule. This link opens the same setting, without duplicating it.</p></div><button class="text-button" data-setting="Heartbeat">Open Heartbeat ${icon('arrow')}</button></div>`;else rows=`<div class="notice">This study shows the proposed home for “${escapeHtml(name)}”. Its detailed controls are not designed yet.</div><div class="setting-row"><div><h3>One destination for this setting</h3><p>Search, contextual links, and related pages all open this same destination. No competing copies under General, Configuration, or Integrations.</p></div></div>`;return `<div class="settings-detail">${common}<section class="card">${rows}</section><p class="small muted" style="margin-top:18px">Design preview · Changes here affect this preview only.</p></div>${note()}`}
function structure(){return `${head('A quieter workspace. A clearer map.','The same capabilities, with fewer competing places to begin.',false)}<div class="structure-grid"><section class="card"><div class="eyebrow">Daily navigation</div><h2 style="margin-top:12px">Seven destinations. No accordion maze.</h2><div class="structure-list"><div><strong>Home</strong><p>Start work, open Companion, continue a session, see decisions.</p></div><div><strong>Companion · Sessions · To-dos</strong><p>Your coordinator, individual work, and things saved for later.</p></div><div><strong>Activity</strong><p>Decisions first, results second. Technical events are a deeper view.</p></div><div><strong>Library · Automation</strong><p>Documents, notes, research and outputs; runs, schedules and agent diagnostics.</p></div><div><strong>Settings, anchored at the bottom</strong><p>All configuration lives here. Admin and advanced controls appear within the relevant group.</p></div></div></section><section class="card"><div class="eyebrow">Design language</div><h2 style="margin-top:12px">Personality in the welcome. Clarity in the work.</h2><div class="token-swatches"><span class="swatch" style="--swatch:#102b30" title="Deep ink"></span><span class="swatch" style="--swatch:#185d54" title="Action green"></span><span class="swatch" style="--swatch:#e8eee5" title="Companion paper"></span><span class="swatch" style="--swatch:#fbf2df" title="Decision amber"></span><span class="swatch" style="--swatch:#f8faf8" title="Canvas"></span></div><ul class="rules"><li>One filled primary action per section. Other actions are quiet links or outlined buttons.</li><li>Color means something: green for working, amber for a decision, red only for a confirmed failure.</li><li>Use human summaries: “Choose a restart time,” not a tool transcript or an incident identifier.</li><li>Show current state, latest verified outcome, and next step. A changing plan is not a completion percentage.</li><li>Keep body text readable. Reserve monospace for commands, paths and identifiers.</li><li>Sidebar width is your choice and persists. Moving between pages never folds sections for you.</li></ul></section><section class="card"><div class="eyebrow">Attention policy</div><h2 style="margin-top:12px">A decision is not a notification.</h2><div class="structure-list"><div><strong>Needs you</strong><p>Only a decision you can resolve, with a clear next action. Technical failures first go to investigation; they are not disguised as requests for consent.</p></div><div><strong>Ready to read</strong><p>One result per session or deliverable. Collapse repetitive worker completions.</p></div><div><strong>Nothing waiting</strong><p>Say “Nothing needs your attention.” Reclaim the space for current work.</p></div><div><strong>Stale or unavailable</strong><p>Say so explicitly. Never turn missing status into “all clear.”</p></div></div></section><section class="card"><div class="eyebrow">Settings ownership</div><h2 style="margin-top:12px">Every control has one home.</h2><div class="structure-list"><div><strong>Heartbeat → Companion & automation</strong><p>One switch. Roster and diagnostics link back to it.</p></div><div><strong>CLI access → Machines & access</strong><p>Installed programs, machine identity, workspace folders and permissions have a connected map.</p></div><div><strong>Mail → Connected accounts</strong><p>Multiple inboxes and calendars together. Reading mail stays in the work surface.</p></div><div><strong>Models → Models & knowledge</strong><p>Providers and topic assignments together. Companion links to its specific model setting.</p></div></div><button class="text-button" data-view="settings" style="margin-top:18px">Explore the settings example ${icon('arrow')}</button></section></div><div class="notice">These are design proposals using illustrative data. Capability consolidation and migrations would be separate implementation work; no live settings or permissions are changed.</div>${note()}`}
function render(){const focused=document.activeElement;const restore=focused?.matches('[data-project-tab]')?'[data-project-tab="'+focused.dataset.projectTab+'"]':focused?.matches('[data-select-project]')?'[data-select-project="'+focused.dataset.selectProject+'"]':null;const url=new URL(location.href);url.searchParams.set('direction',state.direction);url.searchParams.set('view',state.view==='detail'?'settings':state.view);history.replaceState(null,'',url);document.body.className=`design-${state.direction}`;content.innerHTML=state.view==='settings'?settings():state.view==='detail'?detail():state.view==='structure'?structure():({a:calm,b:companion,c:desk})[state.direction]();document.querySelector('#location-label').textContent=state.view==='home'?(state.direction==='c'?'Workspace':'Home'):state.view==='structure'?'Design structure':'Settings';document.querySelectorAll('[data-direction]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.direction===state.direction)));document.querySelectorAll('.nav-item[data-view]').forEach(b=>{let active=(b.dataset.view==='settings'&&state.view==='detail')||b.dataset.view===state.view;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});document.querySelector('.nav-item[data-view="home"] .nav-label').textContent=state.direction==='c'?'Workspace':'Home';updateCollapse();if(restore)document.querySelector(restore)?.focus({preventScroll:true});}
function updateCollapse(){const collapsed=frame.classList.contains('collapsed');const b=document.querySelector('#collapse');b.setAttribute('aria-expanded',String(!collapsed));b.setAttribute('aria-label',collapsed?'Expand navigation':'Collapse navigation');b.title=collapsed?'Expand navigation':'Collapse navigation';b.querySelector('.nav-label').textContent=collapsed?'Expand menu':'Collapse menu'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
let returnFocus=null;
function openDialog(title,body){if(document.querySelector('#dialog').hidden)returnFocus=document.activeElement;document.querySelector('#dialog-body').innerHTML=`<div class="drawer-label">${icon('spark')} INTERACTIVE DESIGN PREVIEW</div><h2 id="dialog-title">${title}</h2>${body}`;document.querySelector('#dialog').hidden=false;document.body.style.overflow='hidden';document.querySelector('.dialog-close').focus()}
function closeDialog(){document.querySelector('#dialog').hidden=true;document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus()}
function inspectSession(i){const p=projects[i],d=deskDetails[i];openDialog(escapeHtml(p.name),`<p><span class="badge ${p.kind}">${p.status}</span></p><div class="sample-reply"><strong>${d.now}</strong><p>${d.last}</p><p><strong>Next:</strong> ${d.next}</p></div><p>${d.change}</p><button class="text-button" data-action="plan" style="margin-top:12px">View current plan ${icon('arrow')}</button>`)}
function project(i){const p=projects[i];openDialog(escapeHtml(p.name),`<p>${p.description}</p><div class="sample-reply"><strong>Session handoff</strong><p>Open directly into this conversation, with its plan, recent messages, and current state. No intermediary “pick a conversation” page.</p></div><p class="small">This example does not open or modify a real session.</p>${p.kind==='amber'?'<button class="primary" data-action="decision" style="margin-top:20px">Review the decision</button>':''}`)}
const actions={
plan:()=>openDialog('The current plan',`<p>The plan is a changing record of the work. New discoveries can add tasks, remove steps, or change their order.</p><div class="sample-reply">${escapeHtml(deskDetails[state.selectedProject].change)}</div><p>Show what changed and what comes next. Task counts are optional context, never a project completion percentage.</p>`),
companion:()=>openDialog('Your companion',`<p>One ongoing chat for ideas, updates, and coordinating work across sessions.</p><form id="dialog-companion"><textarea aria-label="Ask Companion" placeholder="Ask about a project or share an idea…"></textarea><button class="primary">Preview a reply ${icon('arrow')}</button></form>`),
new:()=>openDialog('What would you like to work on?',`<p>Start a focused session. Your companion remains a separate, ongoing conversation.</p><form id="new-work"><textarea aria-label="Describe new work" placeholder="Describe the idea, question, or task…" required></textarea><button class="primary">Preview new session ${icon('arrow')}</button></form>`),
decision:()=>openDialog('When should the update go live?',`<p><strong>Solar System Map</strong><br>The update is ready. A restart is expected to briefly interrupt the service.</p><div class="sample-reply">In the product, this view would show the verified scope, impact, and latest evidence before you decide.</div><div class="flex" style="margin-top:24px;flex-wrap:wrap"><button class="primary" data-action="simulate-decision">Preview “Update now”</button><button class="secondary" data-action="simulate-decision">Preview “Later”</button></div><p class="small">Preview only. No deployment or permission is granted.</p>`),
'simulate-decision':()=>openDialog('A clear decision, in one place.',`<p>The product would record your choice against the existing session and show its outcome here. This preview sends nothing.</p>`),
sessions:()=>openDialog('Your sessions',`<p>Working sessions first. Search and history live here.</p>${projects.map((p,i)=>`<button class="compact-session" data-project="${i}"><span class="badge ${p.kind}">${p.status}</span><h3>${p.name}</h3><p>${p.description}</p></button>`).join('')}`),
tasks:()=>openDialog('For later',`<p>Ideas and follow-ups are saved here. Queued work can be picked up by Heartbeat within your configured authority.</p><div class="sample-reply">Compare local model performance<br><br>Refresh website statistics</div><button class="text-button" data-action="idea" style="margin-top:14px">Save another idea ${icon('plus')}</button>`),
idea:()=>openDialog('Keep an idea for later',`<p>A light way to park something without starting a new project now.</p><form id="idea-form"><textarea aria-label="Idea for later" placeholder="What should we come back to?" required></textarea><button class="primary">Save in this preview ${icon('plus')}</button></form>`),
activity:()=>openDialog('What matters since your last visit',`<p><span class="badge amber">Needs you · 1</span></p><button class="compact-session" data-action="decision"><h3>Solar System Map · Choose a restart time</h3><p>Ready for your decision.</p></button><p><span class="badge neutral">Ready to read · 2</span></p><button class="compact-session" data-project="2"><h3>Yetano performance comparison</h3><p>Research findings are ready.</p></button><div class="compact-session"><h3>BPMN editor review passed</h3><p>Routine worker completions are grouped under the result.</p></div>`),
briefing:()=>openDialog('The short version',`<p>Life² is running its release checks. The Solar System Map update needs a restart time. Your Yetano comparison is ready to read.</p><p>That is the whole summary. Tool transcripts stay inside the relevant session.</p>`),
library:()=>openDialog('Library',`<p>Documents, notes, research, and saved outputs belong together. Browse by type inside this destination rather than expanding another sidebar group.</p><div class="sample-reply">Documents · Notes · Research · Outputs · Knowledge</div>`),
automation:()=>openDialog('Automation',`<p>See what is running, inspect pipelines, and manage scheduled work. Agent-level records and diagnostic logs live one level deeper.</p><div class="sample-reply">Runs · Pipelines · Schedules · Agent diagnostics</div><button class="text-button" data-setting="Heartbeat" style="margin-top:16px">Heartbeat settings ${icon('arrow')}</button>`),
system:()=>openDialog('System status & usage',`<p>Detailed service health, provider costs, token usage, and cache statistics move here. Home shows a compact status and only surfaces an outage when it affects your work.</p><p>Live data would include its source and freshness. Missing data is shown as unavailable.</p>`),
search:()=>{closeDialog();state.view='settings';state.filter='';render();document.querySelector('#settings-search').focus()},
interval:()=>openDialog('Check interval',`<p>This study proposes a single interval control on the Heartbeat settings page. The running state elsewhere links back here.</p>`),
environment:()=>openDialog('Review workstation access',`<p>Machine, account, installed programs, credentials, and unattended work appear together. Broad account access must be explained before activation; explicit denials remain visible.</p><p>This visual study neither grants nor revokes access.</p>`),
model:()=>openDialog('Choose the Companion model',`<p>Pick from your configured models here. This is the single home for the Companion binding, with a link from topic assignments.</p>`),
supervision:()=>openDialog('Supervision & budget',`<p>See supervised sessions, the Companion spending limit, and permitted automatic actions together. Project pipeline budgets stay separate and are labelled as such.</p>`)
};
document.addEventListener('click',event=>{const target=event.target.closest('button');if(!target)return;if(target.matches('.dialog-close,.mobile-backdrop')){closeDialog();frame.classList.remove('mobile-open');return}if(target.matches('.mobile-menu')){frame.classList.add('mobile-open');return}if(target.id==='collapse'){frame.classList.toggle('collapsed');try{localStorage.setItem('octipus.design-preview.collapsed',frame.classList.contains('collapsed'))}catch{}updateCollapse();return}if(target.dataset.direction){state.direction=target.dataset.direction;render();return}if(target.dataset.view){closeDialog();state.view=target.dataset.view;state.filter='';render();frame.classList.remove('mobile-open');return}if(target.dataset.setting){closeDialog();state.view='detail';state.setting=target.dataset.setting;render();return}if(target.dataset.project!==undefined){project(Number(target.dataset.project));return}if(target.dataset.selectProject!==undefined){state.selectedProject=Number(target.dataset.selectProject);state.view='home';render();frame.classList.remove('mobile-open');if(matchMedia('(max-width:800px)').matches)inspectSession(state.selectedProject);return}if(target.dataset.projectTab){state.projectTab=target.dataset.projectTab;const first=projects.findIndex(p=>state.projectTab==='all'||p.state===state.projectTab);if(first>=0)state.selectedProject=first;render();return}if(target.matches('[role="switch"]')){target.setAttribute('aria-checked',target.getAttribute('aria-checked')==='false'?'true':'false');return}if(target.dataset.action){frame.classList.remove('mobile-open');actions[target.dataset.action]?.()}});
document.addEventListener('input',event=>{if(event.target.getAttribute('aria-label')==='Message Companion')state.companionDraft=event.target.value;if(event.target.id==='settings-search'){state.filter=event.target.value;document.querySelector('#settings-results').innerHTML=settingResults()}});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='idea-form'){const value=event.target.querySelector('textarea').value;openDialog('Idea saved in this preview.',`<div class="sample-reply">${escapeHtml(value)}</div><p>In the product, it would appear in To-dos with a visible queued state. No live to-do was created.</p>`)}else if(event.target.id==='new-work'){openDialog('A focused session starts here.',`<p>Your task would open in a new session immediately. Its title, working state, and next step would appear on Home.</p><p>No real session was created.</p>`)}else{const input=event.target.querySelector('input,textarea');openDialog('A reply that gives you the picture.',`<p class="small">Your message: ${escapeHtml(input?.value||'Catch me up')}</p><div class="sample-reply">Life² is working through release checks. Solar System Map needs your restart decision. The Yetano comparison is ready to read.</div><p>Illustrative response only. No model call was made.</p>`)}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){closeDialog();frame.classList.remove('mobile-open')}if((event.metaKey||event.ctrlKey)&&event.key==='k'){event.preventDefault();actions.search()}if(event.key==='Tab'&&!document.querySelector('#dialog').hidden){const focusable=[...document.querySelector('#dialog').querySelectorAll('button,input,textarea,a[href]')];const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});
document.querySelector('#dialog').addEventListener('click',event=>{if(event.target.id==='dialog')closeDialog()});
render();
</script>
</body>
</html>
